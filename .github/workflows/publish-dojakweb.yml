name: Publish Dojakweb (GitHub Packages)

on:
  workflow_dispatch:
  push:
    tags:
      - "dojak-web-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@jonheaven"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare publish package
        run: node packages/dojakweb/scripts/prepare-github-package.mjs

      - name: Publish @jonheaven/dojak-web
        working-directory: packages/dojakweb/.publish-github
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
