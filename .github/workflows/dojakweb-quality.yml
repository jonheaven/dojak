name: Dojakweb Quality

on:
  pull_request:
    paths:
      - "packages/dojakweb/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/dojakweb-quality.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "packages/dojakweb/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/dojakweb-quality.yml"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @dojak/web
        run: pnpm --filter @dojak/web run typecheck

      - name: Build @dojak/web npm bundle
        run: pnpm --filter @dojak/web run build:npm
